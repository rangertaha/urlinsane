name: Go

on:
  push:
    branches: [ "master"]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Read the version from go.mod rather than pinning it here. The pin said
        # 1.22 while go.mod required 1.25, so CI could not have built this tree.
        go-version-file: 'go.mod'

    - name: Build
      run: make build

    - name: Check
      run: make check
