title: URLInsane
description: A book about typosquatting, and the tool that hunts it.
url: https://rangertaha.github.io
baseurl: /urlinsane

# Directory-style URLs: /guide/first-scan/ rather than /guide/first-scan.html.
# The cross-references throughout the book are relative and assume this.
permalink: pretty

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Sidebar and search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  tokenizer_separator: /[\s\-/]+/
  rel_url: true

heading_anchors: true
color_scheme: dark

aux_links:
  GitHub: https://github.com/rangertaha/urlinsane
aux_links_new_tab: true

nav_external_links:
  - title: Releases
    url: https://github.com/rangertaha/urlinsane/releases
  - title: pkg.go.dev
    url: https://pkg.go.dev/github.com/rangertaha/urlinsane

back_to_top: true
back_to_top_text: Back to top

footer_content: >-
  URLInsane is licensed under the GPLv3.
  Copyright &copy; 2024-2026 Rangertaha.

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Careful
    color: yellow
  todo:
    title: Not built yet
    color: red

exclude:
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
